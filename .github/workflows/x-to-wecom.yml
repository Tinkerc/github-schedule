name: X to WeCom

on:
  schedule:
    - cron: "30 1 * * *" # 每天北京时间 09:30
  workflow_dispatch:
    inputs:
      query:
        description: "临时覆盖 X 查询语句；留空时使用仓库变量 X_QUERY"
        required: false
        type: string
      max_results:
        description: "获取条数（10-100）"
        required: false
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: x-to-wecom
  cancel-in-progress: false

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      WECOM_X_WEBHOOK_URL: ${{ secrets.WECOM_X_WEBHOOK_URL || secrets.WECOM_WEBHOOK_URL }}
      X_QUERY: ${{ inputs.query || vars.X_QUERY }}
      X_MAX_RESULTS: ${{ inputs.max_results || vars.X_MAX_RESULTS || '10' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install requests==2.32.3

      - name: Fetch X posts and notify WeCom
        run: python scripts/x_to_wecom.py
